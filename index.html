<style>

.dot{width:10px;height:10px;border-radius:50%;background:var(--r);flex:none}.dot.on{background:var(--g)}.dot.wait{background:var(--y)}

<header><div><b>ScalperX Pro</b><small>BTC/USDT · Binance Futures</small></div><div id="px">--</div><span class="dot" id="dot"></span><button class="ib" id="thm" aria-label="Tema">☀</button></header>

<script>
(function(){
"use strict";
var K="scalperx_v1",N=40,FUT="https://fapi.binance.com";
var D={initial:100,entry:12,tp:.5,sl:.5,cd:20,lev:50,fee:.05,theme:"dark",tf:"15m",mode:"sim",demoUrl:"https://demo-fapi.binance.com",strat:"ma",fast:9,slow:20,filt:1,atrm:1.5,rr:2,dloss:10,minN:100};
var cfg,S;
function fresh(){S={avail:cfg.initial,trades:[],pos:null,lastClose:0}}
(function(){try{var o=JSON.parse(localStorage.getItem(K)||"null");cfg=Object.assign({},D,o&&o.cfg);if(o&&o.st)S=Object.assign({avail:cfg.initial,trades:[],pos:null,lastClose:0},o.st);else fresh()}catch(e){cfg=Object.assign({},D);fresh()}})();
function save(){try{localStorage.setItem(K,JSON.stringify({cfg:cfg,st:S}))}catch(e){}}
var kb={demo:{k:"",s:""},real:{k:"",s:""}},rem=false;try{var kk=JSON.parse(localStorage.getItem("scalperx_keys")||"null");if(kk&&kk.demo){kb=kk;rem=true}}catch(e){}
function ck(){return kb[cfg.mode==="real"?"real":"demo"]}
var busy=false,emerg=false,usdbrl=5.5,fxc=0,levOk=false,realOK=false,tryT=0,lt=0,running=false,candles=[],last=0,ws=null,lastMsg=0,tab="trade",rcT=0,liveT=0,wl=null,worker=null,btRes=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(s){return document.querySelector(s)}
function R(n){return(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function P(n){return(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function sg(n){return n>0?"up":n<0?"dn":""}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function tt(ms){var d=new Date(ms);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR")}
/* ---------- indicadores ---------- */
function ema(v,n){var k=2/(n+1),e=v[0],o=[e];for(var i=1;i<v.length;i++){e=v[i]*k+e*(1-k);o.push(e)}return o}
function atrA(cs,n){var o=[],a=0;for(var i=0;i<cs.length;i++){var c=cs[i],pc=i?cs[i-1].c:c.o,tr=Math.max(c.h-c.l,Math.abs(c.h-pc),Math.abs(c.l-pc));a=i===0?tr:(i<n?(a*i+tr)/(i+1):(a*(n-1)+tr)/n);o.push(a)}return o}
function ind(cs){var cl=cs.map(function(c){return c.c});return{f:ema(cl,cfg.fast),s:ema(cl,cfg.slow),t:ema(cl,200),a:atrA(cs,14)}}
function sigAt(I,cs,i){if(i<Math.max(cfg.slow,cfg.filt?200:0)+1)return 0;var up=I.f[i-1]<=I.s[i-1]&&I.f[i]>I.s[i],dn=I.f[i-1]>=I.s[i-1]&&I.f[i]<I.s[i];if(up&&(!cfg.filt||cs[i].c>I.t[i]))return 1;if(dn&&(!cfg.filt||cs[i].c<I.t[i]))return -1;return 0}
function qtyFor(p){var q=Math.floor(cfg.entry*cfg.lev/usdbrl/p/.001+1e-9)*.001;if(q*p<cfg.minN)q=Math.ceil(cfg.minN/p/.001-1e-9)*.001;return+q.toFixed(3)}
function levels(dir,p,a,n){if(cfg.strat==="ma"&&a>0){var d=a*cfg.atrm;return{sl:p-dir*d,tp:p+dir*d*cfg.rr}}return{tp:p*(1+dir*cfg.tp/n),sl:p*(1-dir*cfg.sl/n)}}
function lvOf(o){return o.sl!=null?{sl:o.sl,tp:o.tp}:levels(o.dir,o.entry,0,o.notional)}
/* ---------- conexão ---------- */
function setDot(){var d=$("#dot"),ok=ws&&ws.readyState===1&&Date.now()-lastMsg<8000;d.className="dot "+(ok?"on":(ws&&ws.readyState===0?"wait":""))}
function loadHist(){var tf=cfg.tf;try{fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval="+tf+"&limit=500").then(function(r){return r.json()}).then(function(a){if(tf!==cfg.tf||!Array.isArray(a))return;var h=a.map(function(k){return{t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],x:1}}),lt2=h.length?h[h.length-1].t:0;candles=h.concat(candles.filter(function(c){return c.t>lt2}));if(candles.length)last=candles[candles.length-1].c;live(true)}).catch(function(){})}catch(e){}}
function loadFx(){try{fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTBRL").then(function(r){return r.json()}).then(function(j){if(+j.price>0)usdbrl=+j.price}).catch(function(){})}catch(e){}}
function connect(){
 clearTimeout(rcT);if(ws){ws.onclose=ws.onerror=ws.onmessage=null;try{ws.close()}catch(e){}}
 try{ws=new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@kline_"+cfg.tf)}catch(e){rcT=setTimeout(connect,1500);return}
 ws.onopen=function(){lastMsg=Date.now();setDot()};
 ws.onmessage=function(ev){lastMsg=Date.now();var d;try{d=JSON.parse(ev.data)}catch(e){return}if(d&&d.k){var k=d.k,c={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,x:k.x?1:0},n=candles.length;if(n&&candles[n-1].t===c.t)candles[n-1]=c;else if(!n||c.t>candles[n-1].t)candles.push(c);if(candles.length>700)candles.shift();last=c.c;tick();if(c.x)onClose();live()}};
 ws.onclose=ws.onerror=function(){setDot();clearTimeout(rcT);rcT=setTimeout(connect,1000)};
 setDot()}
function watchdog(){var stale=Date.now()-lastMsg>6000;if(!ws||ws.readyState>1||stale)connect();setDot()}
function wake(){try{if(navigator.wakeLock&&document.visibilityState==="visible"){navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null})}).catch(function(){})}}catch(e){}}
function startWorker(){try{var b=new Blob(["setInterval(function(){postMessage(1)},1000)"],{type:"application/javascript"});worker=new Worker(URL.createObjectURL(b));worker.onmessage=beat}catch(e){worker=null;setInterval(beat,1000)}}
function beat(){watchdog();tick();if(++fxc%60===0)loadFx();live(true)}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){wake();connect();loadHist()}});
window.addEventListener("online",connect);window.addEventListener("focus",function(){wake();watchdog()});
/* ---------- API Binance (Demo/Real) ---------- */
function hmac(sec,msg){var e=new TextEncoder();return crypto.subtle.importKey("raw",e.encode(sec),{name:"HMAC",hash:"SHA-256"},false,["sign"]).then(function(k){return crypto.subtle.sign("HMAC",k,e.encode(msg))}).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function base(){return cfg.mode==="real"?FUT:cfg.demoUrl}
function sreq(method,path,params){var c=ck(),qs=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k])}).join("&");qs+=(qs?"&":"")+"recvWindow=5000&timestamp="+Date.now();
 return hmac(c.s,qs).then(function(sig){return fetch(base()+path+"?"+qs+"&signature="+sig,{method:method,headers:{"X-MBX-APIKEY":c.k}})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function emsg(e){return((e&&e.msg)||"falha de rede")+((e&&e.code)?" ("+e.code+")":"")}
/* ---------- robô ---------- */
function pnl(p){var o=S.pos;return o?o.notional*o.dir*(p/o.entry-1):0}
function dayPnl(){var d=new Date();d.setHours(0,0,0,0);var t=d.getTime(),s=0;S.trades.forEach(function(x){if(x.t1>=t)s+=x.net});return s}
function allowed(){return Date.now()-S.lastClose>=cfg.cd*1000&&dayPnl()>-cfg.dloss}
function place(dir,ep,q,n,mg,lv,live){S.avail-=mg;S.pos={dir:dir,entry:ep,margin:mg,notional:n,fee:n*cfg.fee/100,t:Date.now(),qty:q,sl:lv.sl,tp:lv.tp,live:live?1:0};save();toast((dir>0?"COMPRA ":"VENDA ")+q+" BTC");live2();}
function live2(){live(true);if(tab==="trade")build()}
function openPos(dir,p,a){
 if(busy||S.pos)return;var q=qtyFor(p),n=q*p*usdbrl,mg=n/cfg.lev;
 if(S.avail<mg){running=false;toast("Saldo insuficiente: precisa de "+R(mg));live2();return}
 var lv=levels(dir,p,a,n);
 if(cfg.mode==="sim"){place(dir,p,q,n,mg,lv,0);return}
 var c=ck();if(!c.k||!c.s){running=false;toast("Cole as chaves na aba API");live2();return}
 busy=true;emerg=false;var pre=levOk?Promise.resolve():sreq("POST","/fapi/v1/leverage",{symbol:"BTCUSDT",leverage:Math.round(cfg.lev)}).then(function(){levOk=true},function(){});
 pre.then(function(){return sreq("POST","/fapi/v1/order",{symbol:"BTCUSDT",side:dir>0?"BUY":"SELL",type:"MARKET",quantity:q.toFixed(3),newOrderRespType:"RESULT"})}).then(function(o){
  var ep=+o.avgPrice>0?+o.avgPrice:p,nn=q*ep*usdbrl;lv=levels(dir,ep,a,nn);place(dir,ep,q,nn,mg,lv,1);
  return sreq("POST","/fapi/v1/algoOrder",{symbol:"BTCUSDT",side:dir>0?"SELL":"BUY",algoType:"CONDITIONAL",type:"STOP_MARKET",triggerPrice:lv.sl.toFixed(1),closePosition:"true",workingType:"MARK_PRICE"}).then(function(r){if(S.pos){S.pos.algo=r.algoId||r.clientAlgoId||null;save()}},function(e){emerg=true;busy=false;running=false;toast("Stop na Binance falhou ("+emsg(e)+"): fechando por segurança");tryT=0;closePos(last,"SEGURANÇA")})
 }).then(function(){if(!emerg)busy=false;live2()}).catch(function(e){busy=false;running=false;toast("Binance: "+emsg(e));live2()})}
function closePos(p,why){var o=S.pos;if(!o)return;
 if(o.live){if(busy||Date.now()-tryT<5000)return;tryT=Date.now();busy=true;
  sreq("POST","/fapi/v1/order",{symbol:"BTCUSDT",side:o.dir>0?"SELL":"BUY",type:"MARKET",quantity:o.qty.toFixed(3),reduceOnly:"true",newOrderRespType:"RESULT"}).then(function(r){busy=false;finish(+r.avgPrice>0?+r.avgPrice:p,why);cancelAlgo(o)}).catch(function(e){busy=false;if(e&&e.code===-2022){finish(p,why);cancelAlgo(o);return}toast("Não fechou ("+emsg(e)+"). Tentando de novo…")});return}
 finish(p,why)}
function cancelAlgo(o){if(o.algo)sreq("DELETE","/fapi/v1/algoOrder",{symbol:"BTCUSDT",algoId:o.algo}).catch(function(){})}
function finish(p,why){var o=S.pos;if(!o)return;var gross=pnl(p),fees=o.fee+o.notional*cfg.fee/100,net=gross-fees;S.avail+=Math.max(0,o.margin+net);
 S.trades.push({t0:o.t,t1:Date.now(),dir:o.dir,entry:o.entry,exit:p,gross:gross,fees:fees,net:net,why:why,margin:o.margin});S.pos=null;S.lastClose=Date.now();
 if(running&&dayPnl()<=-cfg.dloss){running=false;toast("Limite de perda diária atingido: robô parado")}else toast((net>=0?"Lucro ":"Perda ")+R(net));
 save();if(tab==="trade"||tab==="hist"||tab==="res")build();else live(true)}
function tick(){if(!last)return;var o=S.pos;
 if(o){var l=lvOf(o);if(o.dir>0?last>=l.tp:last<=l.tp)closePos(last,"TP");else if(o.dir>0?last<=l.sl:last>=l.sl)closePos(last,"SL");return}
 if(cfg.strat==="micro"&&running&&allowed()){var c=candles[candles.length-1];if(c){var d=c.c>c.o?1:c.c<c.o?-1:0;if(d)openPos(d,last,0)}}}
function onClose(){if(cfg.strat!=="ma")return;var I=ind(candles),i=candles.length-1,d=sigAt(I,candles,i);if(!d)return;var o=S.pos;
 if(o){if(o.dir!==d)closePos(last,"SINAL");return}
 if(running&&allowed())openPos(d,last,I.a[i])}
/* ---------- backtest ---------- */
function backtest(cs){
 var I=ind(cs),bal=cfg.initial,pos=null,T=[],eq=[cfg.initial],peak=bal,dd=0,w0=Math.max(cfg.slow,cfg.filt?200:0)+1;
 function close(px,why){var g=pos.n*pos.dir*(px/pos.e-1),f=pos.n*cfg.fee/100*2,net=g-f;bal+=pos.mg+net;T.push({net:net,why:why});pos=null;eq.push(bal);peak=Math.max(peak,bal);dd=Math.max(dd,peak-bal)}
 for(var i=0;i<cs.length;i++){var c=cs[i];
  if(pos){var hs=pos.dir>0?c.l<=pos.sl:c.h>=pos.sl,ht=pos.dir>0?c.h>=pos.tp:c.l<=pos.tp;if(hs)close(pos.sl,"SL");else if(ht)close(pos.tp,"TP")}
  var d=sigAt(I,cs,i);
  if(d){if(pos&&pos.dir!==d)close(c.c,"SINAL");
   if(!pos){var q=qtyFor(c.c),n=q*c.c*usdbrl,mg=n/cfg.lev;if(bal>=mg){var a=I.a[i]*cfg.atrm;pos={dir:d,e:c.c,n:n,mg:mg,sl:c.c-d*a,tp:c.c+d*a*cfg.rr};bal-=mg}}}}
 if(pos)close(cs[cs.length-1].c,"FIM");
 var wins=T.filter(function(t){return t.net>0}),gw=0,gl=0;T.forEach(function(t){if(t.net>0)gw+=t.net;else gl+=-t.net});
 var st=cs[Math.min(w0,cs.length-1)];
 return{n:T.length,wr:T.length?wins.length/T.length*100:0,net:bal-cfg.initial,pf:gl?gw/gl:(gw?99:0),dd:dd,bh:(cs[cs.length-1].c/st.c-1)*100,days:(cs[cs.length-1].t-st.t)/864e5,eq:eq,fees:T.length*0}}
function runBt(){var r=$("#btres");if(cfg.strat!=="ma"){r.innerHTML='<div class="warn">O backtest vale só para a estratégia de médias. Troque em Config.</div>';return}
 r.textContent="Baixando histórico da Binance…";
 fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval="+cfg.tf+"&limit=1000").then(function(x){return x.json()}).then(function(a){if(!Array.isArray(a))throw 0;var cs=a.map(function(k){return{t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}});btRes=backtest(cs);btRes.tf=cfg.tf;renderBt()}).catch(function(){r.innerHTML='<div class="warn">Não consegui baixar o histórico (rede ou bloqueio do navegador).</div>'})}
function renderBt(){var r=$("#btres");if(!r||!btRes)return;var b=btRes,k=function(l,v,c){return'<div class="k"><small>'+l+'</small><b class="'+(c||"")+'">'+v+'</b></div>'},line="";
 if(b.eq.length>1){var a=Math.min.apply(null,b.eq),m=Math.max.apply(null,b.eq),rg=(m-a)||1;line='<svg viewBox="0 0 340 90" width="100%"><polyline fill="none" stroke-width="2" style="stroke:'+(b.net>=0?"var(--g)":"var(--r)")+'" points="'+b.eq.map(function(v,i){return(i*340/(b.eq.length-1)).toFixed(1)+","+(85-(v-a)/rg*80).toFixed(1)}).join(" ")+'"/></svg>'}
 r.innerHTML='<div class="g2">'+k("Período testado",b.days.toFixed(0)+" dias ("+b.tf+")")+k("Operações",b.n)+k("Resultado líquido",R(b.net),sg(b.net))+k("Taxa de acerto",b.wr.toFixed(1).replace(".",",")+"%")+k("Fator de lucro",b.pf.toFixed(2).replace(".",","))+k("Maior queda",R(b.dd),"dn")+k("Segurar BTC no período",b.bh.toFixed(1).replace(".",",")+"%",sg(b.bh))+k("Retorno da estratégia",(b.net/cfg.initial*100).toFixed(1).replace(".",",")+"%",sg(b.net))+'</div>'+line+'<p class="note">Taxas já descontadas ('+cfg.fee+'% por lado). Histórico não garante o futuro. Fator de lucro abaixo de 1 = a estratégia perdeu dinheiro no período.</p>'}
/* ---------- gráfico ---------- */
function chart(){
 var W=360,H=230,pr=48,pb=16,v=candles.slice(-N);if(!v.length)return'<div class="st" style="padding:80px 0">Conectando à Binance…</div>';
